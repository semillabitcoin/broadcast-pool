version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_SEMILLABITCOIN_BROADCAST_POOL_IP}
      APP_PORT: ${APP_SEMILLABITCOIN_BROADCAST_POOL_PORT}
      # Gate the web dashboard behind Umbrel login (it can view/export raw hex
      # and trigger broadcasts). Explicit so it never depends on a store default.
      PROXY_AUTH_ADD: "true"

  app:
    image: ghcr.io/semillabitcoin/broadcast-pool:v0.3.21@sha256:d59e083c5cf09f239a421e80bb013849e4f1e487e1c7c67c235f633e9573e051
    init: true
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "50005:50005"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ELECTRUM_HOST: ${APP_ELECTRS_NODE_IP}
      ELECTRUM_PORT: ${APP_ELECTRS_NODE_PORT}
      # Bitcoin node RPC — fallback for height/MTP, broadcast and confirmations
      # when electrs is down/slow (injected via the 'bitcoin' dependency). Works
      # with any node speaking the standard Bitcoin RPC: Core, Knots, Libre Relay.
      # Confirmation lookups need txindex=1 on the node.
      BITCOIN_RPC_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      DB_PATH: /data/pool.db
      WEB_PORT: "4040"
      WEB_BIND: "0.0.0.0"
      PROXY_PORT: "50005"
      APP_SEED: ${APP_SEED}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_HIDDEN_SERVICE: ${APP_HIDDEN_SERVICE}
    # Reach other Umbrel apps (e.g. the price oracle) via their host-published ports.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: ${APP_SEMILLABITCOIN_BROADCAST_POOL_IP}
