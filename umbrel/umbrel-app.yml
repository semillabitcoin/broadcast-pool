manifestVersion: 1
id: semillabitcoin-broadcast-pool
category: bitcoin
name: Broadcast Pool
version: "0.3.21"
tagline: Schedule Bitcoin transaction broadcasts
description: >-
  Electrum proxy that intercepts signed transactions from Sparrow, Liana or
  manual import, retains them, and broadcasts at the target block or date
  you configure. Ideal for wallet migrations and UTXO cycling with temporal
  separation.

  Compatible with Electrs and Fulcrum. Supports mainnet, testnet and signet.
  NIP-44 encrypted vault (Nostr) for confirmed transaction history.

  Inspired by Craig Raw's Broadcast Pool proposal (bitcoin/bitcoin#30471).
releaseNotes: >-
  v0.3.21 — Bitcoin node fallback: when your Electrum server (electrs)
  is down or slow, Broadcast Pool keeps working by reading height/MTP,
  broadcasting and verifying confirmations directly against your Bitcoin
  node (Core, Knots or Libre Relay). A status light in the header shows
  the fallback as ready / active / unavailable. At-rest encryption moves
  to standard AES-256-GCM and a one-time startup sweep encrypts any
  retained transaction left in cleartext by earlier versions. Fixes a bug
  where price-scheduled transactions could not be rebroadcast, and
  centralizes the pre-broadcast safety checks so no path can emit an
  expired or not-yet-unlocked transaction. The dashboard is gated behind
  Umbrel login. Security: aiohttp updated to 3.14.1. Requires the Bitcoin
  app; confirmation lookups via the node need txindex=1.
developer: Semilla Bitcoin
